# ─── Server ──────────────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}

# ─── PostgreSQL ───────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5555}/${DB_NAME:hr_saas_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA ──────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ─── Liquibase ────────────────────────────────────────────────────────────────
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

# ─── JWT ──────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:aHJzeXN0ZW1qd3RzZWNyZXRrZXkyMDI0YWhtYWRhbGhhbGxhcWRldmVsb3Blcg==}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# ─── Admin credentials file ───────────────────────────────────────────────────
hr.admin.credentials-file=${ADMIN_CREDENTIALS_FILE:./admin_credentials.txt}

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.mainprofile=INFO
logging.level.org.springframework.security=WARN
logging.level.liquibase=DEBUG
