# Server
server.port=8080

# PostgreSQL - connects to Docker container running locally
spring.datasource.url=jdbc:postgresql://localhost:5555/hr_saas_db
spring.datasource.username=postgres
spring.datasource.password=postgres123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

# JWT
app.jwt.secret=aHJzeXN0ZW1qd3RzZWNyZXRrZXkyMDI0YWhtYWRhbGhhbGxhcWRldmVsb3Blcg==
app.jwt.expiration=86400000

# Logging
logging.level.com.mainprofile=INFO
logging.level.org.springframework.security=WARN
logging.level.liquibase=INFO
