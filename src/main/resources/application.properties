# Server
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/hr_saas_db
spring.datasource.username=postgres
spring.datasource.password=postgres123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

# Keycloak / OAuth2
# Use 'keycloak:8080' for Docker, 'localhost:8180' for local testing
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/hr-saas

# Logging
logging.level.com.mainprofile=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.liquibase=INFO
