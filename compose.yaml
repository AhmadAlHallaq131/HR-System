# Development compose — starts ONLY the database.
# Run the backend from IntelliJ and the frontend with: npm run dev

services:
  db:
    image: postgres:15
    container_name: hr_postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME:-hr_saas_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${DB_PORT:-5555}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-hr_saas_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
